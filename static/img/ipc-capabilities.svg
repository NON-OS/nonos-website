<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0a0c0e"/>
  <text x="200" y="25" font-family="system-ui" font-size="14" fill="#66FFFF" text-anchor="middle" font-weight="600">Capability-Based IPC</text>
  <rect x="30" y="45" width="100" height="80" rx="4" fill="#1a1e22" stroke="#444"/>
  <text x="80" y="70" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Sender</text>
  <rect x="40" y="80" width="80" height="35" rx="2" fill="#202428"/>
  <text x="80" y="95" font-family="monospace" font-size="8" fill="#66FFFF" text-anchor="middle">IPC Cap</text>
  <text x="80" y="108" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Ed25519 Token</text>
  <rect x="150" y="45" width="100" height="80" rx="4" fill="#66FFFF" fill-opacity="0.1" stroke="#66FFFF"/>
  <text x="200" y="70" font-family="system-ui" font-size="11" fill="#66FFFF" text-anchor="middle" font-weight="600">Kernel</text>
  <text x="200" y="90" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Validate Cap</text>
  <text x="200" y="103" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Copy Message</text>
  <text x="200" y="116" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Route to Recv</text>
  <rect x="270" y="45" width="100" height="80" rx="4" fill="#1a1e22" stroke="#444"/>
  <text x="320" y="70" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Receiver</text>
  <rect x="280" y="80" width="80" height="35" rx="2" fill="#202428"/>
  <text x="320" y="95" font-family="monospace" font-size="8" fill="#66FFFF" text-anchor="middle">IPC Cap</text>
  <text x="320" y="108" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Ed25519 Token</text>
  <line x1="130" y1="85" x2="150" y2="85" stroke="#66FFFF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="85" x2="270" y2="85" stroke="#66FFFF" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#66FFFF"/></marker></defs>
  <text x="200" y="155" font-family="system-ui" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">11 Capability Types</text>
  <g transform="translate(30, 170)">
    <rect width="75" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="37" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">CoreExec</text>
  </g>
  <g transform="translate(115, 170)">
    <rect width="55" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="27" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">IO</text>
  </g>
  <g transform="translate(180, 170)">
    <rect width="65" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="32" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Network</text>
  </g>
  <g transform="translate(255, 170)">
    <rect width="50" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="25" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">IPC</text>
  </g>
  <g transform="translate(315, 170)">
    <rect width="60" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="30" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Memory</text>
  </g>
  <g transform="translate(30, 200)">
    <rect width="60" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="30" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Crypto</text>
  </g>
  <g transform="translate(100, 200)">
    <rect width="75" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="37" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">FileSystem</text>
  </g>
  <g transform="translate(185, 200)">
    <rect width="70" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="35" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Hardware</text>
  </g>
  <g transform="translate(265, 200)">
    <rect width="55" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="27" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Debug</text>
  </g>
  <g transform="translate(330, 200)">
    <rect width="55" height="22" rx="2" fill="#202428" stroke="#66FFFF" stroke-opacity="0.5"/>
    <text x="27" y="15" font-family="monospace" font-size="9" fill="#66FFFF" text-anchor="middle">Admin</text>
  </g>
  <text x="200" y="250" font-family="system-ui" font-size="10" fill="#555" text-anchor="middle">Time-limited | Revocable | Delegatable | Non-forgeable</text>
  <text x="200" y="275" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">Ed25519 Signed Capability Tokens</text>
