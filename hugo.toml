baseURL = "https://nonos.software/"
languageCode = "en"
title = "NØNOS"
theme = "nonos"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "NØNOS is a sovereign operating system: a Rust microkernel where every program is a signed, attested capsule. Capability security, RAM-resident state, verified from bootloader to userland."
  github = "https://github.com/NON-OS"
  mainsite = "https://nonos.systems"
  linkhub = "https://nonos.dev"
  release_date = "2026-07-22"
  live_url = "http://localhost:3000"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "github-dark"
  lineNos = false
  tabWidth = 4

