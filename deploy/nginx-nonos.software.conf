# Hardened nginx vhost for nonos.software (static Hugo site).
# The site loads zero third-party resources, so the CSP can be strict:
# scripts and everything else are self-only; the one concession is inline
# styles (a handful of style="" attributes for bars/gradients), which carry
# no injection risk on a static site with no attacker-controlled input.

# --- redirect http -> https, and www -> apex ---
server {
    listen 80;
    listen [::]:80;
    server_name nonos.software www.nonos.software;
    return 301 https://nonos.software$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nonos.software;
    ssl_certificate     /etc/letsencrypt/live/nonos.software/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonos.software/privkey.pem;
    return 301 https://nonos.software$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nonos.software;

    root /var/www/nonos.software;
    index index.html;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/nonos.software/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonos.software/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # --- security headers (applied to every response) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # strict CSP: scripts/frames/objects self-only; inline styles allowed
    # (needed for a few style="" attributes; not a script vector).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # --- do not leak server details ---
    server_tokens off;

    # --- hotlink protection: assets load only from our own pages or a
    # direct visit, not embedded from someone else's site. Not a copy
    # preventer (nothing is on a public site), but it stops bandwidth
    # theft and other sites reusing our images and 3D bundles inline. ---
    valid_referers none blocked nonos.software *.nonos.software;

    # --- caching ---
    location ~* \.(css|js|mjs|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        if ($invalid_referer) { return 403; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        # headers above are not inherited into a new location block; re-assert the essentials
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # gzip (brotli if the module is present is even better)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

    # clean routing; Hugo already emits directory index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # block dotfiles and common junk
    location ~ /\.(?!well-known) { deny all; }
}
