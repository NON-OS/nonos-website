{{ $news := where .Site.RegularPages "Section" "news" }}
{{ if $news }}
<section class="news-teaser">
  <div class="wrap">
    <div class="shead reveal">
      <h2>Latest from the project.</h2>
    </div>
    <div class="grid">
      {{ range first 3 $news }}
      <a class="glass reveal" href="{{ .Permalink }}">
        <time>{{ .Date.Format "January 2, 2006" }}</time>
        <h3>{{ .Title }}</h3>
        <p>{{ .Description }}</p>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
